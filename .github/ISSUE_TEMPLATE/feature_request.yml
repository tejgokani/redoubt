name: Feature request
description: Suggest a new check, platform, output format or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: For a new check, name the rootkit technique it would catch and the two independent sources it would compare.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to implement it?
      options: ["Yes", "Maybe, with guidance", "No"]
