name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -k WERROR=1
      - run: make test
      - name: Kernel facts (context for the live-scan log, see docs/EVALUATION.md)
        run: |
          uname -a
          echo "taint: $(cat /proc/sys/kernel/tainted)"
          echo "modules: $(wc -l < /proc/modules) listed, $(ls /sys/module | wc -l) in sysfs"
          echo "vmallocinfo module-area regions: $(sudo grep -cE '^ *0xffffffffc' /proc/vmallocinfo || echo n/a)"
      - name: Live scan (must be CLEAN with full coverage on a real, unmodified kernel)
        run: |
          sudo ./redoubt scan --no-color -v
          sudo ./redoubt scan --json > /tmp/scan.json
          python3 -c "
          import json
          r = json.load(open('/tmp/scan.json'))
          assert r['verdict'] == 'CLEAN', 'false positive on a clean real kernel: ' + r['verdict']
          assert r['coverage']['skipped'] == 0, 'a check could not run: ' + str(r['coverage'])
          print('OK:', r['coverage']['ran'], 'checks ran, 0 skipped, verdict CLEAN')
          "
      - name: Snapshot the real kernel
        run: sudo ./redoubt snapshot real-linux && sudo chown -R "$USER" real-linux
      - uses: actions/upload-artifact@v4
        with:
          name: real-linux-snapshot
          path: real-linux
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make WERROR=1
      - run: make test
      - run: ./redoubt scan --fail-on critical; test $? -le 1
