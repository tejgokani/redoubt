name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -k WERROR=1
      - run: make test
      - name: Kernel facts (ground truth for the collectors)
        run: |
          uname -a
          echo "taint: $(cat /proc/sys/kernel/tainted)"
          echo "--- enabled_functions"; sudo head -40 /sys/kernel/tracing/enabled_functions || true
          echo "--- kallsyms module tags"; sudo awk 'NF>=4 {print $4}' /proc/kallsyms | sort | uniq -c | sort -rn | head -20
          echo "--- vmallocinfo callers (module area)"; sudo awk '$1 ~ /0xffffffffc/ {print $4}' /proc/vmallocinfo | sed 's/+.*//' | sort | uniq -c | sort -rn | head -15
          echo "--- vmallocinfo sample"; sudo grep -m6 -E 'module|bpf|ftrace' /proc/vmallocinfo || true
          echo "--- dmesg taint"; sudo dmesg | grep -i taint | head || true
          echo "--- modules"; wc -l < /proc/modules; ls /sys/module | wc -l
      - name: Live scan
        run: sudo ./redoubt scan --no-color -v || true
      - name: Snapshot the real kernel
        run: sudo ./redoubt snapshot real-linux && sudo chown -R "$USER" real-linux
      - uses: actions/upload-artifact@v4
        with:
          name: real-linux-snapshot
          path: real-linux
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make WERROR=1
      - run: make test
      - run: ./redoubt scan --fail-on critical; test $? -le 1
